<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Support Contribution Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden border-t-8 border-purple-600">
        
        <!-- Header Section -->
        <div class="px-6 py-6 sm:px-8 bg-white border-b border-gray-100">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Community Support Contribution Form</h1>
            <p class="mt-2 text-sm text-gray-600">
                Thank you for your generosity. Please complete this form to process your donation towards our community development initiatives.
            </p>
            <div class="mt-3 text-xs text-red-500 font-medium">* Indicates required question</div>
        </div>

        <!-- Form Body -->
        <form id="contributionForm" class="px-6 py-6 sm:px-8 space-y-6">

            <!-- Anonymous / Autonomous Selection -->
            <div class="bg-purple-50/50 p-5 rounded-lg border border-purple-100">
                <label class="block text-sm font-semibold text-gray-900 mb-3">
                    Autonomous / Anonymous Donation <span class="text-red-500">*</span>
                </label>
                <div class="space-y-3">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" name="autonomous" value="yes" required class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300">
                        <span class="text-sm font-medium text-gray-800">Yes (Donate anonymously)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" name="autonomous" value="no" checked class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300">
                        <span class="text-sm font-medium text-gray-800">No</span>
                    </label>
                </div>
            </div>

            <!-- Contact Details Section -->
            <div id="contactDetailsSection" class="space-y-4 pt-2">
                <div class="border-b pb-2">
                    <h2 class="text-lg font-semibold text-purple-800">Contact Details</h2>
                    <p class="text-xs text-gray-500">Provide your contact details</p>
                </div>

                <div>
                    <label id="nameLabel" class="block text-sm font-medium text-gray-700 mb-1">
                        Donor Name <span id="nameAsterisk" class="text-red-500">*</span>
                    </label>
                    <input type="text" id="donorName" name="donorName" placeholder="Your full name" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-sm">
                </div>

                <div>
                    <label id="mobileLabel" class="block text-sm font-medium text-gray-700 mb-1">
                        Mobile no <span id="mobileAsterisk" class="text-red-500">*</span>
                    </label>
                    <input type="tel" id="mobileNo" name="mobileNo" placeholder="Your 10-digit mobile number" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-sm">
                </div>
            </div>

            <!-- Donation Details Section -->
            <div class="space-y-4 pt-4">
                <div class="border-b pb-2">
                    <h2 class="text-lg font-semibold text-purple-800">Donation Details</h2>
                    <p class="text-xs text-gray-500">Provide your donation details</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-900 mb-3">
                        Donation Amount <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-purple-50 transition">
                            <input type="radio" name="amount" value="101" required class="text-purple-600 focus:ring-purple-500">
                            <span class="text-sm font-medium text-gray-800">₹101</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-purple-50 transition">
                            <input type="radio" name="amount" value="501" class="text-purple-600 focus:ring-purple-500">
                            <span class="text-sm font-medium text-gray-800">₹501</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-purple-50 transition">
                            <input type="radio" name="amount" value="1001" class="text-purple-600 focus:ring-purple-500">
                            <span class="text-sm font-medium text-gray-800">₹1,001</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-purple-50 transition">
                            <input type="radio" name="amount" value="2001" class="text-purple-600 focus:ring-purple-500">
                            <span class="text-sm font-medium text-gray-800">₹2,001</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 border rounded-lg cursor-pointer hover:bg-purple-50 transition">
                            <input type="radio" name="amount" value="5001" class="text-purple-600 focus:ring-purple-500">
                            <span class="text-sm font-medium text-gray-800">₹5,001</span>
                        </label>
                    </div>
                    <div class="mt-3 flex items-center space-x-3">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="amount" value="other" class="text-purple-600 focus:ring-purple-500">
                            <span class="text-sm font-medium text-gray-800">Other:</span>
                        </label>
                        <input type="number" id="otherAmount" name="otherAmount" placeholder="Enter amount" 
                            class="flex-1 px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                    </div>
                </div>

                <!-- Mode of Payment -->
                <div>
                    <label class="block text-sm font-semibold text-gray-900 mb-2">
                        Mode of Payment <span class="text-red-500">*</span>
                    </label>
                    <select name="paymentMode" required class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-sm">
                        <option value="">Choose payment mode</option>
                        <option value="UPI">UPI / QR Code</option>
                        <option value="Net Banking">Net Banking</option>
                        <option value="Credit/Debit Card">Credit / Debit Card</option>
                        <option value="Cash">Cash</option>
                    </select>
                </div>
            </div>

            <!-- Form Action Buttons -->
            <div class="pt-6 border-t border-gray-100 flex items-center justify-between">
                <button type="reset" id="clearBtn" class="text-sm font-medium text-purple-600 hover:text-purple-800 transition">
                    Clear form
                </button>
                <div class="space-x-3">
                    <button type="submit" id="submitBtn" class="px-6 py-2 bg-purple-600 text-white font-medium rounded-lg shadow hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition text-sm">
                        Submit
                    </button>
                </div>
            </div>
            <div id="formStatus" class="text-center text-sm font-medium hidden"></div>

        </form>
    </div>

    <!-- Script to handle Dynamic Validation & URL-encoded Form submission -->
    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
        const scriptURL = 'https://script.google.com/macros/s/AKfycbykO6OOQGNsJr4AZ9z6lGHQ06WX3YJDBJgbFKtOCdyGbHGd8fjncm5TT0dy28U0_ye1/exec';

        const autonomousRadios = document.querySelectorAll('input[name="autonomous"]');
        const donorNameInput = document.getElementById('donorName');
        const mobileNoInput = document.getElementById('mobileNo');
        const nameAsterisk = document.getElementById('nameAsterisk');
        const mobileAsterisk = document.getElementById('mobileAsterisk');
        const form = document.getElementById('contributionForm');
        const submitBtn = document.getElementById('submitBtn');
        const formStatus = document.getElementById('formStatus');

        // Toggle required fields based on Anonymous selection
        autonomousRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'yes') {
                    donorNameInput.removeAttribute('required');
                    mobileNoInput.removeAttribute('required');
                    nameAsterisk.style.display = 'none';
                    mobileAsterisk.style.display = 'none';
                } else {
                    donorNameInput.setAttribute('required', 'true');
                    mobileNoInput.setAttribute('required', 'true');
                    nameAsterisk.style.display = 'inline';
                    mobileAsterisk.style.display = 'inline';
                }
            });
        });

        // Submit form data using URLSearchParams and no-cors
        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            formStatus.classList.add('hidden');

            const formData = {
                formType: 'donation_form',
                autonomous: form.querySelector('input[name="autonomous"]:checked').value,
                donorName: donorNameInput.value,
                mobileNo: mobileNoInput.value,
                amount: form.querySelector('input[name="amount"]:checked').value,
                otherAmount: document.getElementById('otherAmount').value,
                paymentMode: form.querySelector('select[name="paymentMode"]').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                formStatus.textContent = 'Thank you! Your contribution has been recorded successfully.';
                formStatus.className = 'text-center text-sm font-medium text-green-600 mt-2';
                formStatus.classList.remove('hidden');
                form.reset();
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
                nameAsterisk.style.display = 'inline';
                mobileAsterisk.style.display = 'inline';
                donorNameInput.setAttribute('required', 'true');
                mobileNoInput.setAttribute('required', 'true');
            })
            .catch(error => {
                formStatus.textContent = 'Error submitting form. Please try again.';
                formStatus.className = 'text-center text-sm font-medium text-red-600 mt-2';
                formStatus.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            });
        });
    </script>
</body>
</html>
